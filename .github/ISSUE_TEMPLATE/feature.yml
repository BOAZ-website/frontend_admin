name: 기능 요청
description: 새로운 기능이나 사용자 경험 개선 작업을 제안합니다.
title: 'feat: '
labels:
  - enhancement
body:
  - type: checkboxes
    id: duplicate-check
    attributes:
      label: 중복 확인
      options:
        - label: 기존 이슈에 같은 요청이 없는지 확인했습니다.
          required: true

  - type: textarea
    id: background
    attributes:
      label: 배경과 목적
      description: 해결하려는 문제와 이 기능이 필요한 이유를 작성해 주세요.
      placeholder: 현재 어떤 문제가 있으며, 변경 후 어떤 결과를 기대하는지 설명해 주세요.
    validations:
      required: true

  - type: textarea
    id: requirements
    attributes:
      label: 요구사항
      description: 구현되어야 할 동작을 구체적으로 작성해 주세요.
      placeholder: |
        - 사용자는 ...할 수 있다.
        - ...인 경우 ...로 표시한다.
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: 완료 조건
      description: 작업 완료 여부를 확인할 수 있는 조건을 체크리스트로 작성해 주세요.
      placeholder: |
        - [ ] 주요 동작이 구현된다.
        - [ ] 오류 상황을 처리한다.
        - [ ] 필요한 검증을 통과한다.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 영향 영역
      multiple: true
      options:
        - UI/디자인
        - 상태 및 비즈니스 로직
        - API 연동
        - CI/개발 환경
        - 문서
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: 참고 자료
      description: 화면, 디자인, 문서 또는 관련 이슈 링크를 첨부해 주세요.
