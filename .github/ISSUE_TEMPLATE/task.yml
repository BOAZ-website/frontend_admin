name: 일반 작업
description: 리팩터링, 문서, CI, 설정 등 개발 작업을 등록합니다.
title: 'chore: '
body:
  - type: textarea
    id: purpose
    attributes:
      label: 목적
      description: 이 작업이 필요한 이유와 해결하려는 문제를 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 작업 범위
      description: 수행할 작업과 제외할 범위를 작성해 주세요.
      placeholder: |
        - 수행: ...
        - 제외: ...
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: 완료 조건
      placeholder: |
        - [ ] 변경 사항이 구현된다.
        - [ ] 관련 검증을 통과한다.
        - [ ] 필요한 문서를 갱신한다.
    validations:
      required: true

  - type: dropdown
    id: task-type
    attributes:
      label: 작업 유형
      options:
        - chore
        - docs
        - refactor
        - test
        - ci
        - build
        - perf
        - style
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: 참고 자료
      description: 관련 문서, 이슈 또는 PR 링크를 작성해 주세요.
